
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CentrAlign{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
            background: #f7f8fa;
        }
        nav {
            display: flex;
            gap: 20px;
            margin-bottom: 28px;
        }
        a { color: #1459a6; }
        .panel {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 22px;
        }
        .error {
            background: #fff0f0;
            border: 1px solid #d99;
            padding: 12px;
            margin-bottom: 16px;
        }
        .success {
            background: #effaf0;
            border: 1px solid #9c9;
            padding: 12px;
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input, select {
            box-sizing: border-box;
            width: 100%;
            max-width: 520px;
            padding: 10px;
        }
        button {
            margin-top: 20px;
            padding: 11px 18px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        .table-wrap { overflow-x: auto; }
    </style>
</head>
<body>
    <h1>CentrAlign AI — Mock Company System</h1>
    <nav>
        <a href="/entries">All entries</a>
        <a href="/entries/new">New invoice entry</a>
        <a href="/api/entries">JSON API</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
